; Public example configuration for taptap-mqtt.
; Copy this file to config.ini and replace every value marked CHANGE_ME.
; Do not commit your real config.ini: it may contain private network details
; and MQTT credentials.
;
; Keep this file free of passwords, public IP addresses, device serial numbers,
; and other details that identify your installation.
; Once finished making changes, save file as config.ini

[MQTT]
; Hostname or IP address of your MQTT broker.
SERVER = CHANGE_ME_MQTT_HOST
PORT = 1883
QOS = 1
TIMEOUT = 5
; Use a dedicated MQTT account with only the permissions required by this bridge.
USER = CHANGE_ME_MQTT_USER
PASS = CHANGE_ME_MQTT_PASSWORD

[TAPTAP]
LOG_LEVEL = warning
; Path to the taptap executable inside the container or on the host.
BINARY = /usr/local/bin/taptap
; Leave empty when using the TCP bridge.
SERIAL =
; Hostname or IP address of the RS-485-to-TCP bridge.
ADDRESS = CHANGE_ME_BRIDGE_HOST
PORT = 7160
; Format: STRING:NAME:MODULE_SERIAL
; Replace these examples with the modules in your own installation.
MODULES = B:Module_01:REPLACE_WITH_SERIAL_01, B:Module_02:REPLACE_WITH_SERIAL_02
TOPIC_PREFIX = taptap
TOPIC_NAME = CHANGE_ME_SITE_NAME
TIMEOUT = 180
UPDATE = 15
; Use a persistent writable path in your container.
STATE_FILE = ./taptap.json

[HA]
DISCOVERY_PREFIX = homeassistant
DISCOVERY_LEGACY = false
BIRTH_TOPIC = homeassistant/status
NODES_AVAILABILITY_ONLINE = false
NODES_AVAILABILITY_IDENTIFIED = false
STRINGS_AVAILABILITY_ONLINE = false
STRINGS_AVAILABILITY_IDENTIFIED = false
STATS_AVAILABILITY_ONLINE = false
STATS_AVAILABILITY_IDENTIFIED = false
; These values are recorder purge/retention categories used by the bridge.
NODES_SENSORS_RECORDER = energy
STRINGS_SENSORS_RECORDER = energy
STATS_SENSORS_RECORDER = energy

[RUNTIME]
MAX_ERROR = 15
; Runtime marker location inside the container.
RUN_FILE = /run/taptap/taptap.run
